<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101827">
    {% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <script defer src="{{ '/assets/js/site.js' | relative_url }}"></script>
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <header class="topbar">
      <button class="menu-button" type="button" aria-label="Toggle navigation" aria-expanded="false">☰</button>
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-mark">AWS</span>
        <span>Best Practices</span>
      </a>
      <button class="theme-button" type="button" aria-label="Toggle color theme">◐</button>
    </header>

    <div class="shell">
      <aside class="sidebar" aria-label="Documentation navigation">
        <nav>
          <a class="nav-home" href="{{ '/' | relative_url }}">Overview</a>
          {% include navigation.html %}
        </nav>
      </aside>

      <main id="content" class="content">
        <article class="doc">
          {{ content }}
        </article>
        <footer>
          <p>Community-maintained guidance. Verify service details against current AWS documentation before production use.</p>
          <a href="{{ site.repository_url }}">View this project on GitHub</a>
        </footer>
      </main>
    </div>
    <div class="backdrop" hidden></div>
    <script type="module">
      import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
      document.querySelectorAll("pre > code.language-mermaid").forEach((code) => {
        const container = document.createElement("div");
        container.className = "mermaid";
        container.textContent = code.textContent;
        code.parentElement.replaceWith(container);
      });
      mermaid.initialize({ startOnLoad: true, theme: document.documentElement.dataset.theme === "dark" ? "dark" : "default" });
    </script>
  </body>
</html>
